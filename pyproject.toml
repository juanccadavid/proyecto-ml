[project]
name = "proyecto-ml"
version = "0.1.0"
description = "Proyecto I - Especialización: proyecto de ciencia de datos (clasificación supervisada)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "openpyxl>=3.1",
    "scikit-learn>=1.5",
    "imbalanced-learn>=0.12",
    "plotly>=5.22",
    "streamlit>=1.38",
    "mlflow>=2.16",
    "python-dotenv>=1.0",
    "joblib>=1.4",
    "pandera>=0.24",
]

[project.optional-dependencies]
# Componentes Hugging Face (pesados: instalan torch). uv sync --extra hf
hf = [
    "tabpfn>=2.0",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
]
# Explicabilidad para la demo. uv sync --extra explain
explain = ["shap>=0.46"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "nbstripout>=0.7",
    "ipykernel>=6.29",
    "nbformat>=5.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proyecto_ml"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PD", "NPY"]

[tool.ruff.lint.per-file-ignores]
"sesiones/*.ipynb" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: pruebas de punta a punta (más lentas)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.coverage.run]
source = ["src/proyecto_ml"]
omit = ["src/proyecto_ml/app.py"]
