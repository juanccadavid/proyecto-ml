# En cada push (cualquier rama): lint + pruebas y, si pasan, se ejecuta el flujo completo (make pipeline).
# Aquí corren los tests del contrato (tests/data/): si alguien relaja una regla, el PR queda en rojo.
# Los resultados (figuras, métricas y el campeón) quedan como artefacto "resultados" de la corrida y el resumen
# del campeón se ve en la pestaña Summary. Todo con datos generados: el extracto real nunca llega a GitHub.
name: CI

on:
  push:
  workflow_dispatch: # botón "Run workflow" en la pestaña Actions

concurrency: # un push nuevo a la misma rama cancela la corrida anterior
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar dependencias (versiones exactas de uv.lock)
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pruebas
        run: uv run pytest

  docker:
    # La imagen de docker compose: que construya y que el simulador encuentre lo que necesita (contrato, datos).
    needs: calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t proyecto-ml:ci .
      - name: Probar la imagen (contrato y elección del campeón en memoria, como el simulador sin models/)
        run: |
          docker run --rm proyecto-ml:ci python -c "
          from proyecto_ml import abandono as a, campeon as c, registro as r
          df, fuente = c.datos_eleccion()
          print(fuente, len(df), 'contrato', r.huella_contrato())
          elegido = c.elegir(a.foto(df, 3), candidatos={'logreg': a.modelos_supervisados()['logreg']}, repeticiones=1, honestos=False)
          print('campeón', elegido.nombre)
          "

  ejecutar:
    needs: calidad
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db # MLflow local del runner: prueba también el registro
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar dependencias (versiones exactas de uv.lock)
        run: uv sync --locked
      - name: Ejecutar el flujo completo (make pipeline)
        run: make pipeline
      - name: Resumen del campeón
        run: uv run python scripts/resumen_campeon.py >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados
          path: |
            reports/figures/
            reports/metrics/
            models/
          retention-days: 14
