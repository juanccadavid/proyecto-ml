# Lint y pruebas en cada Pull Request y en cada push a main.
# Aquí corren los tests del contrato (tests/data/): si alguien relaja una regla, el PR queda en rojo.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar dependencias (versiones exactas de uv.lock)
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pruebas
        run: uv run pytest
