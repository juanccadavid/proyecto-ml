# En cada push (cualquier rama): lint + pruebas y, si pasan, se ejecuta el flujo completo (make pipeline).
# Aquí corren los tests del contrato (tests/data/): si alguien relaja una regla, el PR queda en rojo.
# Los resultados (figuras, métricas y el campeón) quedan como artefacto "resultados" de la corrida y el resumen
# del campeón se ve en la pestaña Summary. Todo con datos generados: el extracto real nunca llega a GitHub.
name: CI

on:
  push:
  workflow_dispatch: # botón "Run workflow" en la pestaña Actions

concurrency: # un push nuevo a la misma rama cancela la corrida anterior
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar dependencias (versiones exactas de uv.lock)
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tipos (mypy)
        run: uv run mypy
      - name: Pruebas
        run: uv run pytest

  pre-commit:
    # Los mismos hooks que en local: secretos (gitleaks), notebooks sin salidas, archivos de datos bloqueados...
    # Corre en paralelo con "calidad"; la caché guarda los entornos de los hooks entre corridas.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Hooks de pre-commit sobre todo el repo
        env:
          SKIP: no-commit-to-branch # protege commits locales en main; en el CI no aplica
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure

  docker:
    # docker compose de punta a punta: el trabajo "campeon" entrena con MLflow (servidor en otro contenedor) y
    # escribe models/; luego el simulador arranca con ese campeón y pasa su healthcheck. Todo sin root.
    needs: calidad
    runs-on: ubuntu-latest
    env:
      CAMPEON_ARGS: "--repeticiones 1 --nuevos 500 --shap 20" # rápido: prueba el flujo, no las cifras
      GIT_COMMIT: ${{ github.sha }} # la imagen no lleva .git: el commit llega por variable
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose.yml
        run: docker compose --profile pipeline config --quiet
      - name: Construir la imagen
        run: docker compose build app
      - name: Probar la imagen (contrato y elección del campeón en memoria, como el simulador sin models/)
        run: |
          docker run --rm proyecto-ml:latest python -c "
          from proyecto_ml import abandono as a, campeon as c, registro as r
          df, fuente = c.datos_eleccion()
          print(fuente, len(df), 'contrato', r.huella_contrato())
          elegido = c.elegir(a.foto(df, 3), candidatos={'logreg': a.modelos_supervisados()['logreg']}, repeticiones=1, honestos=False)
          print('campeón', elegido.nombre)
          "
      - name: Elegir el campeón con docker compose (MLflow en su contenedor)
        run: |
          mkdir -p models reports && sudo chown -R 1000 models reports  # appuser (uid 1000) escribe aquí
          docker compose --profile pipeline run --rm campeon
          test -s models/campeon.json && test -s models/abandono_campeon.joblib
      - name: Levantar el simulador con ese campeón y esperar su healthcheck
        run: |
          docker compose up -d app
          for i in $(seq 1 30); do
            estado=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q app)")
            [ "$estado" = healthy ] && break
            sleep 5
          done
          echo "simulador: $estado"
          [ "$estado" = healthy ]
          curl -fsS http://localhost:8501/_stcore/health
      - name: Logs si algo falló
        if: failure()
        run: docker compose --profile pipeline logs --no-color
      - name: Apagar
        if: always()
        run: docker compose --profile pipeline down -v

  ejecutar:
    needs: calidad
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db # MLflow local del runner: prueba también el registro
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar dependencias (versiones exactas de uv.lock)
        run: uv sync --locked
      - name: Ejecutar el flujo completo (make pipeline)
        run: make pipeline
      - name: Resumen del campeón
        run: uv run python scripts/resumen_campeon.py >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados
          path: |
            reports/figures/
            reports/metrics/
            models/
          retention-days: 14
